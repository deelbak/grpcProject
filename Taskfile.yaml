version: '3'

vars:
  BIN_DIR: '{{.ROOT_DIR}}/bin'

  BUF_VERSION: '1.50.0'
  BUF: '{{.BIN_DIR}}/buf'

  PROTO_GEN_GO_VERSION: '1.36.0'
  PROTO_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'

  PROTO_GEN_GO_GRPC_VERSION: '1.5.1'
  PROTO_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'

  PROTO_GEN_GRPC_GATEWAY_VERSION: '2.15.0'
  PROTO_GEN_GRPC_GATEWAY: '{{.BIN_DIR}}/protoc-gen-grpc-gateway'

  PROTO_GEN_VALIDATE_VERSION: '1.2.1'
  PROTO_GEN_VALIDATE: '{{.BIN_DIR}}/protoc-gen-validate'

  PROTO_GEN_OPENAPIV2_VERSION: '2.26.3'
  PROTO_GEN_OPENAPIV2: '{{.BIN_DIR}}/protoc-gen-openapiv2'

  .MOCKERY_VERSION: 'v2.32.0'
  .MOCKERY: '{{.BIN_DIR}}/mockery'

tasks:
  install-buf:
    desc: Install buf into dir bin
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        if [ ! -f {{.BUF}} ]; then
          echo "Installing buf {{.BUF_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
        fi
    status:
      - test -x {{.BUF}}

  proto:install-plugins:
    desc: Install protoc-gen-go and protoc-gen-go-grpc into dir bin
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        if [ ! -f {{.PROTO_GEN_GO}} ]; then
          echo "Installing protoc-gen-go {{.PROTO_GEN_GO_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@v{{.PROTO_GEN_GO_VERSION}}
        fi
        if [ ! -f {{.PROTO_GEN_GO_GRPC}} ]; then
          echo "Installing protoc-gen-go-grpc {{.PROTO_GEN_GO_GRPC_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v{{.PROTO_GEN_GO_GRPC_VERSION}}
        fi
        if [ ! -f {{.PROTO_GEN_GRPC_GATEWAY}} ]; then
          echo "Installing protoc-gen-grpc-gateway {{.PROTO_GEN_GRPC_GATEWAY_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v{{.PROTO_GEN_GRPC_GATEWAY_VERSION}}
        fi
        if [ ! -f {{.PROTO_GEN_VALIDATE}} ]; then
          echo "Installing protoc-gen-validate {{.PROTO_GEN_VALIDATE_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/envoyproxy/protoc-gen-validate@v{{.PROTO_GEN_VALIDATE_VERSION}}
        fi
        if [ ! -f {{.PROTO_GEN_OPENAPIV2}} ]; then
          echo "Installing protoc-gen-openapiv2 {{.PROTO_GEN_OPENAPIV2_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v{{.PROTO_GEN_OPENAPIV2_VERSION}}
        fi
    status:
      - test -x {{.PROTO_GEN_GO}}
      - test -x {{.PROTO_GEN_GO_GRPC}}
      - test -x {{.PROTO_GEN_GRPC_GATEWAY}}
      - test -x {{.PROTO_GEN_VALIDATE}}
      - test -x {{.PROTO_GEN_OPENAPIV2}}
  proto:lint:
    desc: Lint proto files using buf
    dir: proto
    cmds:
      - '{{.BUF}} lint'

  proto:gen:
    desc: Generate Go code from proto files
    dir: proto
    deps:
      - install-buf
      - proto:install-plugins
    cmds:
      - '{{.BUF}} generate'

  mockery:install:
    desc: Install mockery into dir bin
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          echo "Installing mockery..."
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}
    
  mockery:gen:
    desc: Generate mocks using mockery
    deps: [ mockery:install ]
    cmds:
      - |
        echo "Generating mocks..."
        {{.MOCKERY}}


  proto:update-deps:
    desc: Update buf dependencies
    dir: proto
    cmds:
      - '{{.BUF}} dep update'
