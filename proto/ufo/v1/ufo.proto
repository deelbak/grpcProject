// UFO represents a UFO entity.
message UFO {
  string id = 1;
  string name = 2 [(validate.rules).string = {min_len: 1, max_len: 20}];
  string description = 3;
}

// CreateRequest is a request for creating a UFO.
message CreateRequest {
  string name = 1 [(validate.rules).string = {min_len: 1, max_len: 20}];
  string description = 2;
}

// CreateResponse is a response after creating a UFO.
message CreateResponse {
  UFO ufo = 1;
}

// GetRequest is a request for getting a UFO by id.
message GetRequest {
  string id = 1;
}

// GetResponse is a response containing UFO data.
message GetResponse {
  UFO ufo = 1;
}

// UpdateRequest is a request for updating a UFO.
message UpdateRequest {
  string id = 1;
  string name = 2 [(validate.rules).string = {min_len: 1, max_len: 20}];
  string description = 3;
}

// UpdateResponse is a response after updating a UFO.
message UpdateResponse {
  UFO ufo = 1;
}

// DeleteRequest is a request for deleting a UFO by id.
message DeleteRequest {
  string id = 1;
}

// DeleteResponse is a response after deleting a UFO.
message DeleteResponse {
  bool success = 1;
}