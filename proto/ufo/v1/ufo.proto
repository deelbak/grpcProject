syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/api/annotations.proto";
import "validate/validate.proto";

package ufo.v1;

option go_package = "github.com/deelbak/grpc/pkg/proto/ufo/v1;ufov1";

service UfoService {
  // Create creates a new UFO entry.
    rpc Create(CreateRequest) returns (CreateResponse){
      option (google.api.http) = {
        post: "/api/v1/ufos"
        body: "*"
      };
    };

    // Get retrieves a UFO entry by its ID.
    rpc Get(GetRequest) returns (GetResponse){
      option (google.api.http) = {
        get: "/api/v1/ufos/{id}"
      };
    };

    // Update modifies an existing UFO entry.
    rpc Update(UpdateRequest) returns (google.protobuf.Empty){
      option (google.api.http) = {
        patch: "/api/v1/ufos/{id}"
        body: "*"
      };
    };

    // Delete removes a UFO entry by its ID.
    rpc Delete(DeleteRequest) returns (google.protobuf.Empty){
      option (google.api.http) = {
        delete: "/api/v1/ufos/{id}"
      };
    };
}

// SightingInfo contains information about UFO sighting.
